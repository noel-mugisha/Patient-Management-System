# Application development properties for the project

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

billing:
  service:
    address: ${BILLING_SERVICE_ADDRESS:billing-service}
    grpc:
      port: ${BILLING_SERVICE_GRPC_PORT:9091}